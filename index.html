<script>
    function log(message, type = '') {
        const logsDiv = document.getElementById('logs');
        const className = type ? ` class="${type}"` : '';
        logsDiv.innerHTML += `<div${className}>[${new Date().toLocaleTimeString()}] ${message}</div>`;
        logsDiv.scrollTop = logsDiv.scrollHeight;
    }

    async function startFollowing() {
        const token = document.getElementById('token').value.trim();
        const count = parseInt(document.getElementById('count').value) || 1;
        const btn = document.getElementById('runBtn');

        if (!token) {
            alert('Proszę najpierw wprowadzić token GitHub!');
            return;
        }

        btn.disabled = true;
        document.getElementById('logs').innerHTML = '';
        log(`Rozpoczynam zadanie: zaobserwuj ${count} losowych użytkowników...`);

        let followedCount = 0;
        const headers = {
            'Authorization': `token ${token}`,
            'Accept': 'application/vnd.github.v3+json'
        };

        // Lista popularnych liter do losowania użytkowników
        const alphabet = "abcdefghijklmnopqrstuvwxyz0123456789";

        while (followedCount < count) {
            // Generujemy losową literę/cyfrę i losową stronę wyników
            const randomChar = alphabet[Math.floor(Math.random() * alphabet.length)];
            const randomPage = Math.floor(Math.random() * 100) + 1; 
            
            try {
                // Wyszukujemy użytkowników pasujących do losowej litery
                const searchUrl = `https://github.com{randomChar}&page=${randomPage}&per_page=1`;
                const response = await fetch(searchUrl, { headers });
                
                if (response.status === 401) {
                    log('Błąd: Nieprawidłowy token GitHub.', 'error');
                    break;
                }

                if (response.status === 403) {
                    log('Przekroczono limit zapytań API (Rate Limit). Poczekaj chwilę...', 'error');
                    await new Promise(resolve => setTimeout(resolve, 5000));
                    continue;
                }

                const data = await response.json();
                if (!data.items || data.items.length === 0) continue;
                
                const targetUser = data.items[0].login;
                log(`Znaleziono użytkownika: <strong>${targetUser}</strong>. Próba zaobserwowania...`);

                // Wysyłamy zapytanie o obserwowanie
                const followResponse = await fetch(`https://github.com{targetUser}`, {
                    method: 'PUT',
                    headers: headers
                });

                if (followResponse.status === 204) {
                    log(`Sukces! Zaobserwowano użytkownika ${targetUser}.`, 'success');
                    followedCount++;
                } else {
                    log(`Nie udało się zaobserwować ${targetUser} (Status: ${followResponse.status})`, 'error');
                }

                // Bezpieczna pauza między zapytaniami
                await new Promise(resolve => setTimeout(resolve, 1500));

            } catch (err) {
                log(`Błąd połączenia: ${err.message}. Ponawiam próbę...`, 'error');
                await new Promise(resolve => setTimeout(resolve, 2000));
            }
        }

        log(`Zakończono! Pomyślnie zaobserwowano ${followedCount} użytkowników.`, 'success');
        btn.disabled = false;
    }
</script>
