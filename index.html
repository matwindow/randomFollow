<!DOCTYPE html>
<html lang="pl">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>GitHub Random Follower</title>
    <style>
        body {
            font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Helvetica, Arial, sans-serif;
            background-color: #0d1117;
            color: #c9d1d9;
            display: flex;
            justify-content: center;
            align-items: center;
            height: 100vh;
            margin: 0;
        }
        .container {
            background-color: #161b22;
            padding: 30px;
            border-radius: 8px;
            border: 1px solid #30363d;
            width: 420px;
            box-shadow: 0 4px 10px rgba(0,0,0,0.3);
        }
        h2 { text-align: center; color: #f0f6fc; margin-top: 0; }
        label { display: block; margin: 15px 0 5px; font-size: 14px; }
        input {
            width: 100%;
            padding: 10px;
            background-color: #0d1117;
            border: 1px solid #30363d;
            border-radius: 6px;
            color: #f0f6fc;
            box-sizing: border-box;
            font-size: 14px;
        }
        button {
            width: 100%;
            padding: 12px;
            margin-top: 20px;
            background-color: #238636;
            color: white;
            border: none;
            border-radius: 6px;
            font-weight: bold;
            cursor: pointer;
            font-size: 16px;
        }
        button:hover { background-color: #2ea44f; }
        button:disabled { background-color: #216e39; opacity: 0.6; cursor: not-allowed; }
        #logs {
            margin-top: 20px;
            max-height: 200px;
            overflow-y: auto;
            background: #0d1117;
            padding: 10px;
            border-radius: 6px;
            font-family: monospace;
            font-size: 12px;
            border: 1px solid #30363d;
            white-space: pre-wrap;
            word-break: break-all;
        }
        .success { color: #58a6ff; }
        .error { color: #f85149; }
        .info { color: #8b949e; }
    </style>
</head>
<body>

<div class="container">
    <h2>GitHub Random Follower</h2>
    
    <label for="token">GitHub Personal Access Token (PAT):</label>
    <input type="password" id="token" placeholder="ghp_xxxxxxxxxxxxxxxxxxxx">
    
    <label for="count">How many random people to follow?</label>
    <input type="number" id="count" value="1" min="1" max="50">
    
    <button id="runBtn" onclick="startFollowing()">Find & Follow Random People</button>
    
    <div id="logs">App ready. Enter token and count to start...</div>
</div>

<script>
    function log(message, type = '') {
        const logsDiv = document.getElementById('logs');
        const className = type ? ` class="${type}"` : '';
        logsDiv.innerHTML += `<div${className}>[${new Date().toLocaleTimeString()}] ${message}</div>`;
        logsDiv.scrollTop = logsDiv.scrollHeight;
    }

    async function startFollowing() {
        const token = document.getElementById('token').value.trim();
        const count = parseInt(document.getElementById('count').value) || 1;
        const btn = document.getElementById('runBtn');

        if (!token) {
            alert('Please enter a GitHub Personal Access Token first!');
            return;
        }

        btn.disabled = true;
        document.getElementById('logs').innerHTML = '';
        log(`Starting task to follow ${count} random users...`, 'info');

        let followedCount = 0;
        const headers = {
            'Authorization': `token ${token}`,
            'Accept': 'application/vnd.github.v3+json'
        };

        const alphabet = "abcdefghijklmnopqrstuvwxyz0123456789";

        while (followedCount < count) {
            const randomChar = alphabet[Math.floor(Math.random() * alphabet.length)];
            const randomPage = Math.floor(Math.random() * 100) + 1; 
            
            try {
                // POPRAWIONE: Precyzyjny i prawidłowo sformatowany adres URL API GitHub
                const searchUrl = `https://github.com{randomChar}&page=${randomPage}&per_page=1`;
                const response = await fetch(searchUrl, { headers });
                
                if (response.status === 401) {
                    log('Error: Invalid GitHub Token.', 'error');
                    break;
                }

                if (response.status === 403) {
                    log('API Rate Limit hit. Waiting 10 seconds before retrying...', 'error');
                    await new Promise(resolve => setTimeout(resolve, 10000));
                    continue;
                }

                const data = await response.json();
                if (!data.items || data.items.length === 0) {
                    continue;
                }
                
                // POPRAWIONE: Pobieranie wartości loginu z pierwszego indeksu tablicy [0]
                const targetUser = data.items[0].login;
                log(`Found random user: <strong>${targetUser}</strong>. Attempting to follow...`);

                const followResponse = await fetch(`https://github.com{targetUser}`, {
                    method: 'PUT',
                    headers: headers
                });

                if (followResponse.status === 204) {
                    log(`Successfully followed ${targetUser}!`, 'success');
                    followedCount++;
                } else {
                    log(`Failed to follow ${targetUser} (Status: ${followResponse.status})`, 'error');
                }

                // Bezpieczna dwusekundowa pauza
                await new Promise(resolve => setTimeout(resolve, 2000));

            } catch (err) {
                log(`Connection error: ${err.message}. Retrying...`, 'error');
                await new Promise(resolve => setTimeout(resolve, 3000));
            }
        }

        log(`Finished! Successfully followed ${followedCount} users.`, 'success');
        btn.disabled = false;
    }
</script>

</body>
</html>
