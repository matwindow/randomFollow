<!DOCTYPE html>
<html lang="pl">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>GitHub Random Follower (Turbo)</title>
    <style>
        body {
            font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Helvetica, Arial, sans-serif;
            background-color: #0d1117;
            color: #c9d1d9;
            display: flex;
            justify-content: center;
            align-items: center;
            height: 100vh;
            margin: 0;
        }
        .container {
            background-color: #161b22;
            padding: 30px;
            border-radius: 8px;
            border: 1px solid #30363d;
            width: 420px;
            box-shadow: 0 4px 10px rgba(0,0,0,0.3);
        }
        h2 { text-align: center; color: #f0f6fc; margin-top: 0; }
        label { display: block; margin: 15px 0 5px; font-size: 14px; }
        input {
            width: 100%;
            padding: 10px;
            background-color: #0d1117;
            border: 1px solid #30363d;
            border-radius: 6px;
            color: #f0f6fc;
            box-sizing: border-box;
            font-size: 14px;
        }
        button {
            width: 100%;
            padding: 12px;
            margin-top: 20px;
            background-color: #238636;
            color: white;
            border: none;
            border-radius: 6px;
            font-weight: bold;
            cursor: pointer;
            font-size: 16px;
        }
        button:hover { background-color: #2ea44f; }
        button:disabled { background-color: #216e39; opacity: 0.6; cursor: not-allowed; }
        #logs {
            margin-top: 20px;
            max-height: 200px;
            overflow-y: auto;
            background: #0d1117;
            padding: 10px;
            border-radius: 6px;
            font-family: monospace;
            font-size: 12px;
            border: 1px solid #30363d;
            white-space: pre-wrap;
            word-break: break-all;
        }
        .success { color: #58a6ff; }
        .error { color: #f85149; }
        .info { color: #8b949e; }
    </style>
</head>
<body>

<div class="container">
    <h2>GitHub Random Follower (Turbo)</h2>
    
    <label for="token">GitHub Personal Access Token (PAT):</label>
    <input type="password" id="token" placeholder="ghp_xxxxxxxxxxxxxxxxxxxx">
    
    <label for="count">How many random people to follow?</label>
    <input type="number" id="count" value="10" min="1" max="250">
    
    <button id="runBtn" onclick="startFollowing()">Find & Follow Fast</button>
    
    <div id="logs">App ready. Turbo mode enabled.</div>
</div>

<script>
    function log(message, type = '') {
        const logsDiv = document.getElementById('logs');
        const className = type ? ' class="' + type + '"' : '';
        logsDiv.innerHTML += '<div' + className + '>[' + new Date().toLocaleTimeString() + '] ' + message + '</div>';
        logsDiv.scrollTop = logsDiv.scrollHeight;
    }

    async function startFollowing() {
        const token = document.getElementById('token').value.trim();
        let targetCount = parseInt(document.getElementById('count').value) || 1;
        const btn = document.getElementById('runBtn');

        if (!token) {
            alert('Please enter a GitHub Personal Access Token first!');
            return;
        }

        btn.disabled = true;
        document.getElementById('logs').innerHTML = '';
        log('Starting FAST task to follow ' + targetCount + ' users...', 'info');

        const headers = {
            'Authorization': 'token ' + token,
            'Accept': 'application/vnd.github.v3+json'
        };

        const alphabet = "abcdefghijklmnopqrstuvwxyz0123456789";
        const sub = ['a', 'p', 'i'].join(''); 
        const baseUrl = 'https://' + sub + '.github.com';

        let followedCount = 0;
        let pool = [];

        while (followedCount < targetCount) {
            // Jeśli nasza pula wylosowanych użytkowników jest pusta, pobieramy nową paczkę 100 osób
            if (pool.length === 0) {
                const randomChar = alphabet[Math.floor(Math.random() * alphabet.length)];
                const randomPage = Math.floor(Math.random() * 5) + 1; // Mniejszy zakres stron, by unikać pustych wyników
                
                try {
                    // Pobieramy aż 100 użytkowników na raz!
                    const searchUrl = baseUrl + '/search/users?q=' + randomChar + '&page=' + randomPage + '&per_page=100';
                    const response = await fetch(searchUrl, { headers });
                    
                    if (response.status === 401) {
                        log('Error: Invalid GitHub Token.', 'error');
                        break;
                    }

                    if (response.status === 403) {
                        log('Rate limit hit. Waiting 15 seconds...', 'error');
                        await new Promise(resolve => setTimeout(resolve, 15000));
                        continue;
                    }

                    const data = await response.json();
                    if (data.items && data.items.length > 0) {
                        // Mieszamy tablicę, aby kolejność była losowa
                        pool = data.items.sort(() => 0.5 - Math.random());
                    } else {
                        continue;
                    }
                } catch (err) {
                    log('Search error: ' + err.message, 'error');
                    await new Promise(resolve => setTimeout(resolve, 3000));
                    continue;
                }
            }

            // Pobieramy użytkowników z puli, dopóki jej nie opróżnimy lub nie osiągniemy celu
            const batch = [];
            // Przetwarzamy po 3 użytkowników równolegle, aby nie zablokować limitów GitHuba zbyt szybko
            const batchSize = Math.min(3, pool.length, targetCount - followedCount);

            for (let i = 0; i < batchSize; i++) {
                const userObj = pool.pop();
                if (userObj && userObj.login) {
                    batch.push(userObj.login);
                }
            }

            if (batch.length === 0) continue;

            // Wykonujemy zapytania PUT równolegle (Promise.all)
            const promises = batch.map(async (targetUser) => {
                try {
                    const followUrl = baseUrl + '/user/following/' + targetUser;
                    const followResponse = await fetch(followUrl, {
                        method: 'PUT',
                        headers: headers
                    });

                    if (followResponse.status === 204) {
                        log('Followed: <strong>' + targetUser + '</strong>', 'success');
                        followedCount++;
                    } else {
                        log('Failed for ' + targetUser + ' (Status: ' + followResponse.status + ')', 'error');
                    }
                } catch (err) {
                    log('Error following ' + targetUser + ': ' + err.message, 'error');
                }
            });

            await Promise.all(promises);

            // Bardzo krótka przerwa między paczkami (tylko 300ms zamiast 2000ms!)
            await new Promise(resolve => setTimeout(resolve, 300));
        }

        log('Finished! Successfully followed ' + followedCount + ' users.', 'success');
        btn.disabled = false;
    }
</script>

</body>
</html>
